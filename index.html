    <!-- Home-screen icon on iOS. The explicit tag is required: the site lives
         under /chinese-chess/, so the default /apple-touch-icon.png lookup misses.
         The leading slash makes Vite resolve it against `base` and serve the
         copy in publicDir, instead of bundling a second hashed copy of the
         source file that sits next to this index.html. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

  </head>
